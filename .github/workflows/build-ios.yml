name: Build iOS

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (unsigned)
        run: |
          VERSION=$(cat version.txt | tr -d '[:space:]')
          set +e
          xcodebuild -project SimCharts.xcodeproj -scheme SimCharts \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build MARKETING_VERSION="$VERSION" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" > build.log 2>&1
          STATUS=$?
          set -e
          if [ $STATUS -ne 0 ]; then
            ERRS=$(grep -E "error:" build.log | sort -u | head -40 | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error title=Build errors::${ERRS}"
            tail -30 build.log
            exit $STATUS
          fi

      - name: Package .ipa
        run: |
          VERSION=$(cat version.txt | tr -d '[:space:]')
          APP=$(find build/Build/Products -name "SimCharts.app" -type d | head -1)
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry "SimCharts-v${VERSION}.ipa" Payload

      - uses: actions/upload-artifact@v4
        with:
          name: SimCharts-ipa
          path: "*.ipa"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(cat version.txt | tr -d '[:space:]')
          gh release delete "v${VERSION}" --yes --cleanup-tag || true
          gh release create "v${VERSION}" "SimCharts-v${VERSION}.ipa" \
            --title "SimCharts v${VERSION} (iPhone, unsigned)" \
            --notes "Unsigned .ipa. Install it with Sideloadly or AltStore using your Apple ID."
